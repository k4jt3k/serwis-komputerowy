<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serwis Komputerowy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <header class="pb-3 mb-4 border-bottom">
            <span class="fs-4">System Zarządzania Serwisem 🖥️</span>
        </header>

        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Lista Klientów</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success mb-3" onclick="pobierzKlientow()">Odśwież Listę</button>
                        <ul id="lista-klientow" class="list-group">
                            <li class="list-group-item text-muted">Kliknij przycisk, aby pobrać dane...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function pobierzKlientow() {
            const listaUl = document.getElementById('lista-klientow');
            
            try {
                // Adres Twojego backendu (prawdopodobnie taki jak w Swaggerze)
                const response = await fetch('http://localhost:8080/api/klienci');
                
                if (!response.ok) throw new Error('Błąd połączenia');
                
                const klienci = await response.json();
                
                listaUl.innerHTML = ''; // Czyścimy listę przed dodaniem nowych
                
                klienci.forEach(klient => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    // Dopasuj pola (klient.imie/klient.name) do tego co widzisz w Swaggerze!
                    li.textContent = `ID: ${klient.id} | ${klient.imie || 'Brak imienia'}`; 
                    listaUl.appendChild(li);
                });
            } catch (error) {
                alert("Nie udało się pobrać danych. Sprawdź czy backend działa i czy masz włączony CORS!");
                console.error(error);
            }
        }
    </script>
</body>
</html>
